services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/OpenSendForm:cached
    command: sleep infinity
    environment:
      APP_ENV: dev
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Silence Xdebug "connect" warnings from bin/osf CLI runs (no debugger
      # listener in this container). Takes effect on the next container rebuild.
      XDEBUG_MODE: "off"
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped